<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">End-to-end p99 latency</title>
<desc id="desc">rust-xhttp and Xray-core comparison; lower is better.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526078}.axis{font-size:13px;fill:#526078}.value{font-size:13px;font-weight:650}.label{font-size:14px;font-weight:600}.grid{stroke:#dbe3ef;stroke-width:1}.base{stroke:#7b879c;stroke-width:1.5}</style>
<text class="title" x="90" y="38">End-to-end p99 latency</text>
<text class="sub" x="90" y="64">v0.1.0 evidence snapshot · lower is better · controlled same-host loopback</text>
