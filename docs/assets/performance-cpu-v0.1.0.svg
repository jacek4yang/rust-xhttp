<text class="axis" x="78" y="395.0" text-anchor="end">0.15</text>
<line class="grid" x1="90" y1="317.0" x2="1005" y2="317.0"/>
<text class="axis" x="78" y="321.0" text-anchor="end">0.30</text>
<line class="grid" x1="90" y1="243.0" x2="1005" y2="243.0"/>
<text class="axis" x="78" y="247.0" text-anchor="end">0.45</text>
<line class="grid" x1="90" y1="169.0" x2="1005" y2="169.0"/>
<text class="axis" x="78" y="173.0" text-anchor="end">0.60</text>
<line class="grid" x1="90" y1="95.0" x2="1005" y2="95.0"/>
<text class="axis" x="78" y="99.0" text-anchor="end">0.76</text>
<line class="base" x1="90" y1="465" x2="1005" y2="465"/>
<text class="axis" transform="translate(22 280.0) rotate(-90)" text-anchor="middle">CPU milliseconds / operation</text>
<rect x="165.5" y="344.5" width="68" height="120.5" rx="5" fill="#f97316"/>
<text class="value" x="199.5" y="336.5" text-anchor="middle">0.25</text>
<rect x="251.5" y="206.3" width="68" height="258.7" rx="5" fill="#2563eb"/>
