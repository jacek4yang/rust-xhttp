<text class="label" x="242.5" y="495" text-anchor="middle">Raw server</text>
<text class="axis" x="242.5" y="516" text-anchor="middle">c64</text>
<rect x="470.5" y="357.2" width="68" height="107.8" rx="5" fill="#f97316"/>
<text class="value" x="504.5" y="349.2" text-anchor="middle">0.22</text>
<rect x="556.5" y="205.3" width="68" height="259.7" rx="5" fill="#2563eb"/>
<text class="value" x="590.5" y="197.3" text-anchor="middle">0.53</text>
<text class="label" x="547.5" y="495" text-anchor="middle">Official client</text>
<text class="axis" x="547.5" y="516" text-anchor="middle">c32</text>
<rect x="775.5" y="298.4" width="68" height="166.6" rx="5" fill="#f97316"/>
