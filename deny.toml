# cargo-deny policy. Run: `cargo deny check`
#
# This allowlist covers the MPL-2.0 project plus the reviewed permissive licenses
# currently present in the dependency graph. Any other license fails the check and
# must be reviewed.

[licenses]
allow = [
    "MIT",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Mozilla's curated public WebPKI root-certificate data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[advisories]
# RustSec advisory DB; fail on vulnerabilities, warn on unmaintained/yanked.
yanked = "warn"

[bans]
# Duplicate versions are a warning (common in the wider ecosystem), not a failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
